name: lint

on:
  pull_request:
  push:
    branches:
      - trunk

permissions:
  contents: read

jobs:
  ecs:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - name: Run ECS
        run: composer ecs

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - name: Run PHPStan
        run: composer phpstan -- --error-format=github
