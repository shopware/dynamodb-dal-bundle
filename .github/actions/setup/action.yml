name: Setup
description: Install PHP and install the Composer dependencies

inputs:
  php-version:
    description: PHP version for setup-php
    required: false
    default: '8.4'
  dependencies:
    description: Which Composer dependency versions to resolve — lowest or highest
    required: false
    default: highest

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        coverage: none
        ini-values: memory_limit=-1

    - name: Install dependencies
      uses: ramsey/composer-install@v4
      with:
        dependency-versions: ${{ inputs.dependencies }}
